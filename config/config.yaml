# Configuration file for House Price Prediction Project

# Paths
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models: "models/saved_models"
  notebooks: "notebooks"

# Data Parameters
data:
  test_size: 0.2
  random_state: 42
  cv_folds: 5

# Feature Engineering
features:
  location_clusters: 5
  polynomial_degree: 2
  distance_center_lat: 37.7749  # San Francisco
  distance_center_lon: -122.4194

# Model Parameters
models:
  linear_regression:
    fit_intercept: true
  
  ridge:
    alpha: [0.1, 1.0, 10.0, 100.0]
    max_iter: 1000
  
  lasso:
    alpha: [0.001, 0.01, 0.1, 1.0]
    max_iter: 1000
  
  random_forest:
    n_estimators: [100, 200, 300]
    max_depth: [10, 20, 30, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
    random_state: 42
  
  xgboost:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.1, 0.3]
    subsample: [0.8, 1.0]
    random_state: 42
  
  lightgbm:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.1, 0.3]
    num_leaves: [31, 50, 100]
    random_state: 42

# Evaluation Metrics
evaluation:
  metrics:
    - rmse
    - mae
    - r2
    - mape

# Streamlit App
app:
  title: "🏠 California House Price Predictor"
  page_icon: "🏠"
  layout: "wide"
  theme: "dark"
